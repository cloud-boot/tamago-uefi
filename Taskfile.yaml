  # riscv64 is intentionally still built (so the probe surfaces the
  # "no PCI IO virtio-net" diagnostic cleanly) but acceptance is
  # deferred to M2.1 (SNP rail) per the §3 M2 capability matrix.
  virtionet:elf:amd64:
