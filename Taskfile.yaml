  # Phase-2 M2 probe builds — same pipeline as M1.6 (PCI + SNP +
  # Block IO side-channel) PLUS the `phase2_virtionet_tx` tag, which
  # adds the pure-Go virtio-net rail (Path Y'' / M2). The probe
  # opens the first modern virtio-net device, performs the full
  # Virtio 1.1 §3.1.1 init sequence, transmits two ARP requests
  # (QEMU NAT 10.0.2.x + VZ NAT 192.168.64.x), and polls the RX
  # ring for replies. Outputs go to BOOT<ARCH>-VIRTIONET.EFI.
