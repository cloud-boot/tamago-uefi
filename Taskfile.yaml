  # sends one ICMP Echo Request to the gateway. Outputs go to
  # BOOT<ARCH>-MINISTACK.EFI.
  #
  # Replaces the M3 gvisor probe (R-M3'a CLOSED 2026-06-08 — gvisor
  # was compile-clean but #GP'd inside EDK2 CpuDxe before our
  # dispatcher ran). See `cloud-boot/docs/tamago-uefi-phase2-oci-loader.md`
  # §5 R-M3'a CLOSED for the gvisor backstory + ministack scope.
  ministack:elf:amd64:
    desc: 'Build app_amd64_ministack.elf (TamaGo PIE, M3-minimal + M1.5/M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
