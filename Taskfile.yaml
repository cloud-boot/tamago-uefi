  # Phase-2 M8.1-minimal probe — composes the M7.1a streaming OCI
  # fetcher with the M8.0 LoadImage+StartImage chain-boot mechanism.
  # Same shape as the efihandover:* targets (depends on
  # chainedhello:efi:<arch> so //go:embed has its target file in
  # place) but with the `phase2_oci_kernel_boot` tag instead of
  # `phase2_efi_handover`.
  #
  # MODE B (default in this build): streams the embedded chained EFI
  # bytes through an in-process oci.Transport, SHA-256-verifies via
  # FetchBlobStream, then hands the bytes to LoadImage+StartImage.
  # Proves the full OCI → LoadImage → StartImage pipeline without
  # depending on a publicly-hosted OCI artifact.
  #
  # MODE A (kernelBootTargetRef populated in source): walks a real
  # registry over virtio-net+DHCP+TLS, picks the per-arch manifest,
  # streams the bootable layer, and chain-boots it. Currently dormant
  # pending a write:packages PAT to publish BOOT*-CHAINED.EFI to
  # ghcr.io.
  #
  # Live runner accepts a longer wall-clock cap (120s) than the M7.1a
  # runner because LoadImage on a 1 MiB+ payload + StartImage entry
  # adds non-trivial firmware-side work on top of the streaming leg.
  # amd64 deferred (per the brief) to its own debug sprint behind the
  # M6.1 OVMF >4 MiB threshold; live targets cover arm64/riscv64/loong64.
  kernelboot:elf:amd64:
    desc: 'Build app_amd64_kernelboot.elf (TamaGo PIE, M8.1-minimal probe).'
    deps: [check-toolchain, chainedhello:efi:amd64]
    env:
      GOOS: tamago
