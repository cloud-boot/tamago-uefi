version: '3'

# Reproducible per-arch build pipeline for cloud-boot/tamago-uefi.
#
# Why a Taskfile (not a shell snippet in the README): the build pipeline
# needs GOOS=tamago, GOOSPKG, the correct GOARCH, the right -tags and
# -ldflags, AND the right toolchain ($TAMAGO/bin/go, not the host `go`).
# Open-coding that in a shell each time is how `BOOTRISCV64.EFI` ended up
# with `runtime.GOARCH=amd64` baked into rodata while the .text was
# RISC-V machine code — the env wasn't reset between targets. Each task
# below pins every env var explicitly so no stale value from a previous
# `export` can leak in.
#
# Toolchain locations (overridable):
#   TAMAGO   : path to tamago-go (defaults to ../../../localhost/tamago-pie)
#   PECTL    : path to the pectl source dir (defaults to ../../go-coff/pectl)
#
# The default `pectl` invocation builds it on the fly via `go run` so the
# binary needn't be installed.

vars:
  TAMAGO:
    sh: |
      if [ -n "$TAMAGO" ]; then echo "$TAMAGO";
      else echo "{{.TASKFILE_DIR}}/../../../localhost/tamago-pie"; fi
  PECTL_DIR:
    sh: |
      if [ -n "$PECTL_DIR" ]; then echo "$PECTL_DIR";
      else echo "{{.TASKFILE_DIR}}/../../go-coff/pectl"; fi
  GOOSPKG: github.com/usbarmory/tamago
  BUILD_TAGS: linkcpuinit,linkramstart
  LDFLAGS: -E cpuinit

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list-all
    silent: true

  check-toolchain:
    desc: Verify the tamago-go toolchain and pectl source are reachable.
    silent: true
    cmds:
      - 'test -x "{{.TAMAGO}}/bin/go" || (echo "tamago-go not found at {{.TAMAGO}}/bin/go (set TAMAGO=...)"; exit 1)'
      - 'test -f "{{.PECTL_DIR}}/main.go" || (echo "pectl source not found at {{.PECTL_DIR}} (set PECTL_DIR=...)"; exit 1)'
      - 'echo "toolchain ok: {{.TAMAGO}}/bin/go + {{.PECTL_DIR}}"'

  elf:amd64:
    desc: Build app_amd64.elf (TamaGo PIE, GOOS=tamago GOARCH=amd64).
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64.elf .'

  elf:arm64:
    desc: Build app_arm64.elf (TamaGo PIE, GOOS=tamago GOARCH=arm64).
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64.elf .'

  elf:riscv64:
    desc: Build app_riscv64.elf (TamaGo PIE, GOOS=tamago GOARCH=riscv64).
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64.elf .'

  elf:loong64:
    desc: Build app_loong64.elf (TamaGo PIE, GOOS=tamago GOARCH=loong64).
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64.elf .'

  efi:amd64:
    desc: Link BOOTX64.EFI from app_amd64.elf via pectl link-pie.
    deps: [elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64.EFI" "{{.TASKFILE_DIR}}/app_amd64.elf"'

  efi:arm64:
    desc: Link BOOTAA64.EFI from app_arm64.elf via pectl link-pie.
    deps: [elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64.EFI" "{{.TASKFILE_DIR}}/app_arm64.elf"'

  efi:riscv64:
    desc: Link BOOTRISCV64.EFI from app_riscv64.elf via pectl link-pie.
    deps: [elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64.EFI" "{{.TASKFILE_DIR}}/app_riscv64.elf"'

  efi:loong64:
    desc: Link BOOTLOONGARCH64.EFI from app_loong64.elf via pectl link-pie.
    deps: [elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64.EFI" "{{.TASKFILE_DIR}}/app_loong64.elf"'

  all:
    desc: Build all four EFIs (amd64, arm64, riscv64, loong64).
    cmds:
      - task: efi:amd64
      - task: efi:arm64
      - task: efi:riscv64
      - task: efi:loong64

  test:
    desc: Run banner-rodata tests against the produced EFIs.
    deps: [all]
    env:
      GOWORK: 'off'
    cmds:
      - go test -count=1 -v ./internal/bannertest/...

  # Phase-2 M0 probe builds — same pipeline as the Phase-1 targets but
  # with the `phase2_probe` build tag, which compiles in
  # phase2_probe.go's GetMemoryMap call. The default (untagged) build
  # excludes phase2_probe.go and keeps Phase 1 banner-only behaviour.
  # Outputs go to BOOT<ARCH>-PROBE.EFI to keep them separate from the
  # default artifacts.
  probe:elf:amd64:
    desc: 'Build app_amd64_probe.elf (TamaGo PIE with -tags phase2_probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_probe -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_probe.elf .'

  probe:elf:arm64:
    desc: 'Build app_arm64_probe.elf (TamaGo PIE with -tags phase2_probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_probe -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_probe.elf .'

  probe:elf:riscv64:
    desc: 'Build app_riscv64_probe.elf (TamaGo PIE with -tags phase2_probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_probe -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_probe.elf .'

  probe:elf:loong64:
    desc: 'Build app_loong64_probe.elf (TamaGo PIE with -tags phase2_probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_probe -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_probe.elf .'

  probe:memory:amd64:
    desc: 'Build Phase-2 M0 probe BOOTX64-PROBE.EFI (GetMemoryMap smoke test).'
    deps: [probe:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-PROBE.EFI" "{{.TASKFILE_DIR}}/app_amd64_probe.elf"'

  probe:memory:arm64:
    desc: 'Build Phase-2 M0 probe BOOTAA64-PROBE.EFI (GetMemoryMap smoke test).'
    deps: [probe:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-PROBE.EFI" "{{.TASKFILE_DIR}}/app_arm64_probe.elf"'

  probe:memory:riscv64:
    desc: 'Build Phase-2 M0 probe BOOTRISCV64-PROBE.EFI (GetMemoryMap smoke test).'
    deps: [probe:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-PROBE.EFI" "{{.TASKFILE_DIR}}/app_riscv64_probe.elf"'

  probe:memory:loong64:
    desc: 'Build Phase-2 M0 probe BOOTLOONGARCH64-PROBE.EFI (GetMemoryMap smoke test).'
    deps: [probe:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-PROBE.EFI" "{{.TASKFILE_DIR}}/app_loong64_probe.elf"'

  probe:memory:all:
    desc: 'Build all four Phase-2 M0 probe EFIs.'
    cmds:
      - task: probe:memory:amd64
      - task: probe:memory:arm64
      - task: probe:memory:riscv64
      - task: probe:memory:loong64

  # Phase-2 M1 probe builds — same pipeline as M0, but with the
  # `phase2_pcienum` build tag, which compiles in phase2_pcienum.go's
  # EFI_PCI_IO_PROTOCOL walk + virtio-net identity probe. The two
  # probe tags (phase2_probe and phase2_pcienum) are mutually exclusive
  # at build time; phase2_probe_stub.go gates on `!both` so the default
  # (untagged) build still excludes both probes and keeps Phase 1
  # banner-only behaviour. Outputs go to BOOT<ARCH>-PCIENUM.EFI to keep
  # them separate from M0 and Phase-1 artifacts.
  pcienum:elf:amd64:
    desc: 'Build app_amd64_pcienum.elf (TamaGo PIE with -tags phase2_pcienum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_pcienum.elf .'

  pcienum:elf:arm64:
    desc: 'Build app_arm64_pcienum.elf (TamaGo PIE with -tags phase2_pcienum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_pcienum.elf .'

  pcienum:elf:riscv64:
    desc: 'Build app_riscv64_pcienum.elf (TamaGo PIE with -tags phase2_pcienum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_pcienum.elf .'

  pcienum:elf:loong64:
    desc: 'Build app_loong64_pcienum.elf (TamaGo PIE with -tags phase2_pcienum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_pcienum.elf .'

  pcienum:efi:amd64:
    desc: 'Build Phase-2 M1 BOOTX64-PCIENUM.EFI (PCI IO + virtio-net identity probe).'
    deps: [pcienum:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-PCIENUM.EFI" "{{.TASKFILE_DIR}}/app_amd64_pcienum.elf"'

  pcienum:efi:arm64:
    desc: 'Build Phase-2 M1 BOOTAA64-PCIENUM.EFI (PCI IO + virtio-net identity probe).'
    deps: [pcienum:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-PCIENUM.EFI" "{{.TASKFILE_DIR}}/app_arm64_pcienum.elf"'

  pcienum:efi:riscv64:
    desc: 'Build Phase-2 M1 BOOTRISCV64-PCIENUM.EFI (PCI IO + virtio-net identity probe).'
    deps: [pcienum:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-PCIENUM.EFI" "{{.TASKFILE_DIR}}/app_riscv64_pcienum.elf"'

  pcienum:efi:loong64:
    desc: 'Build Phase-2 M1 BOOTLOONGARCH64-PCIENUM.EFI (PCI IO + virtio-net identity probe).'
    deps: [pcienum:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-PCIENUM.EFI" "{{.TASKFILE_DIR}}/app_loong64_pcienum.elf"'

  pcienum:all:
    desc: 'Build all four Phase-2 M1 PCI-IO enumeration probe EFIs.'
    cmds:
      - task: pcienum:efi:amd64
      - task: pcienum:efi:arm64
      - task: pcienum:efi:riscv64
      - task: pcienum:efi:loong64

  # Phase-2 M1.5 combined probe (PCI-IO + SNP) builds — same pipeline
  # as the M1 pcienum targets but with BOTH phase2_pcienum AND
  # phase2_snpenum tags set, so the dispatcher (phase2_dispatch.go)
  # runs the PCI walk first then the SNP walk in one binary. Outputs
  # go to BOOT<ARCH>-PCISNP.EFI to keep them separate from the
  # pcienum-only artifacts.
  pcisnp:elf:amd64:
    desc: 'Build app_amd64_pcisnp.elf (TamaGo PIE with -tags phase2_pcienum,phase2_snpenum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_pcisnp.elf .'

  pcisnp:elf:arm64:
    desc: 'Build app_arm64_pcisnp.elf (TamaGo PIE with -tags phase2_pcienum,phase2_snpenum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_pcisnp.elf .'

  pcisnp:elf:riscv64:
    desc: 'Build app_riscv64_pcisnp.elf (TamaGo PIE with -tags phase2_pcienum,phase2_snpenum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_pcisnp.elf .'

  pcisnp:elf:loong64:
    desc: 'Build app_loong64_pcisnp.elf (TamaGo PIE with -tags phase2_pcienum,phase2_snpenum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_pcisnp.elf .'

  pcisnp:efi:amd64:
    desc: 'Build Phase-2 M1.5 BOOTX64-PCISNP.EFI (PCI IO + SNP enumeration probe).'
    deps: [pcisnp:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-PCISNP.EFI" "{{.TASKFILE_DIR}}/app_amd64_pcisnp.elf"'

  pcisnp:efi:arm64:
    desc: 'Build Phase-2 M1.5 BOOTAA64-PCISNP.EFI (PCI IO + SNP enumeration probe).'
    deps: [pcisnp:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-PCISNP.EFI" "{{.TASKFILE_DIR}}/app_arm64_pcisnp.elf"'

  pcisnp:efi:riscv64:
    desc: 'Build Phase-2 M1.5 BOOTRISCV64-PCISNP.EFI (PCI IO + SNP enumeration probe).'
    deps: [pcisnp:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-PCISNP.EFI" "{{.TASKFILE_DIR}}/app_riscv64_pcisnp.elf"'

  pcisnp:efi:loong64:
    desc: 'Build Phase-2 M1.5 BOOTLOONGARCH64-PCISNP.EFI (PCI IO + SNP enumeration probe).'
    deps: [pcisnp:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-PCISNP.EFI" "{{.TASKFILE_DIR}}/app_loong64_pcisnp.elf"'

  pcisnp:all:
    desc: 'Build all four Phase-2 M1.5 PCI-IO + SNP probe EFIs.'
    cmds:
      - task: pcisnp:efi:amd64
      - task: pcisnp:efi:arm64
      - task: pcisnp:efi:riscv64
      - task: pcisnp:efi:loong64

  # Phase-2 M1.6 Block-IO side-channel observability probe — same
  # pipeline as M1.5 (pcienum + snpenum together) PLUS the
  # `phase2_blkprintk` build tag, which compiles in the Block-IO
  # ring-buffer print-tee + the LBA-0 scratch writer. On QEMU+EDK2 this
  # mirrors ConOut to a scratch virtio-blk; on Apple VZ (vfkit 0.6.3)
  # where ConOut captures 0 bytes through `virtio-serial,logFilePath`
  # (see R-M1'a in cloud-boot/docs), it's the ONLY way to observe the
  # probe's output. Outputs go to BOOT<ARCH>-BLKPRINT.EFI.
  blkprintk:elf:amd64:
    desc: 'Build app_amd64_blkprintk.elf (TamaGo PIE, M1.5+M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_blkprintk.elf .'

  blkprintk:elf:arm64:
    desc: 'Build app_arm64_blkprintk.elf (TamaGo PIE, M1.5+M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_blkprintk.elf .'

  blkprintk:elf:riscv64:
    desc: 'Build app_riscv64_blkprintk.elf (TamaGo PIE, M1.5+M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_blkprintk.elf .'

  blkprintk:elf:loong64:
    desc: 'Build app_loong64_blkprintk.elf (TamaGo PIE, M1.5+M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_blkprintk.elf .'

  blkprintk:efi:amd64:
    desc: 'Build Phase-2 M1.6 BOOTX64-BLKPRINT.EFI (PCI IO + SNP + Block-IO side-channel).'
    deps: [blkprintk:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-BLKPRINT.EFI" "{{.TASKFILE_DIR}}/app_amd64_blkprintk.elf"'

  blkprintk:efi:arm64:
    desc: 'Build Phase-2 M1.6 BOOTAA64-BLKPRINT.EFI (PCI IO + SNP + Block-IO side-channel).'
    deps: [blkprintk:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-BLKPRINT.EFI" "{{.TASKFILE_DIR}}/app_arm64_blkprintk.elf"'

  blkprintk:efi:riscv64:
    desc: 'Build Phase-2 M1.6 BOOTRISCV64-BLKPRINT.EFI (PCI IO + SNP + Block-IO side-channel).'
    deps: [blkprintk:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-BLKPRINT.EFI" "{{.TASKFILE_DIR}}/app_riscv64_blkprintk.elf"'

  blkprintk:efi:loong64:
    desc: 'Build Phase-2 M1.6 BOOTLOONGARCH64-BLKPRINT.EFI (PCI IO + SNP + Block-IO side-channel).'
    deps: [blkprintk:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-BLKPRINT.EFI" "{{.TASKFILE_DIR}}/app_loong64_blkprintk.elf"'

  blkprintk:all:
    desc: 'Build all four Phase-2 M1.6 Block-IO side-channel probe EFIs.'
    cmds:
      - task: blkprintk:efi:amd64
      - task: blkprintk:efi:arm64
      - task: blkprintk:efi:riscv64
      - task: blkprintk:efi:loong64

  # Phase-2 M2 probe builds — same pipeline as M1.6 (PCI + SNP +
  # Block IO side-channel) PLUS the `phase2_virtionet_tx` tag, which
  # adds the pure-Go virtio-net rail (Path Y'' / M2). The probe
  # opens the first modern virtio-net device, performs the full
  # Virtio 1.1 §3.1.1 init sequence, transmits two ARP requests
  # (QEMU NAT 10.0.2.x + VZ NAT 192.168.64.x), and polls the RX
  # ring for replies. Outputs go to BOOT<ARCH>-VIRTIONET.EFI.
  #
  # riscv64 is intentionally still built (so the probe surfaces the
  # "no PCI IO virtio-net" diagnostic cleanly) but acceptance is
  # deferred to M2.1 (SNP rail) per the §3 M2 capability matrix.
  virtionet:elf:amd64:
    desc: 'Build app_amd64_virtionet.elf (TamaGo PIE, M2 + M1.5/M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_virtionet_tx -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_virtionet.elf .'

  virtionet:elf:arm64:
    desc: 'Build app_arm64_virtionet.elf (TamaGo PIE, M2 + M1.5/M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_virtionet_tx -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_virtionet.elf .'

  virtionet:elf:riscv64:
    desc: 'Build app_riscv64_virtionet.elf (TamaGo PIE, M2 + M1.5/M1.6 tags; riscv64 surfaces "no virtio-net" cleanly per §3 M2).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_virtionet_tx -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_virtionet.elf .'

  virtionet:elf:loong64:
    desc: 'Build app_loong64_virtionet.elf (TamaGo PIE, M2 + M1.5/M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_virtionet_tx -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_virtionet.elf .'

  virtionet:efi:amd64:
    desc: 'Build Phase-2 M2 BOOTX64-VIRTIONET.EFI (virtio-net TX/RX probe).'
    deps: [virtionet:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-VIRTIONET.EFI" "{{.TASKFILE_DIR}}/app_amd64_virtionet.elf"'

  virtionet:efi:arm64:
    desc: 'Build Phase-2 M2 BOOTAA64-VIRTIONET.EFI (virtio-net TX/RX probe).'
    deps: [virtionet:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-VIRTIONET.EFI" "{{.TASKFILE_DIR}}/app_arm64_virtionet.elf"'

  virtionet:efi:riscv64:
    desc: 'Build Phase-2 M2 BOOTRISCV64-VIRTIONET.EFI (virtio-net TX/RX probe; expected to surface "no virtio-net" per §3 M2).'
    deps: [virtionet:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-VIRTIONET.EFI" "{{.TASKFILE_DIR}}/app_riscv64_virtionet.elf"'

  virtionet:efi:loong64:
    desc: 'Build Phase-2 M2 BOOTLOONGARCH64-VIRTIONET.EFI (virtio-net TX/RX probe).'
    deps: [virtionet:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-VIRTIONET.EFI" "{{.TASKFILE_DIR}}/app_loong64_virtionet.elf"'

  virtionet:all:
    desc: 'Build all four Phase-2 M2 virtio-net TX/RX probe EFIs.'
    cmds:
      - task: virtionet:efi:amd64
      - task: virtionet:efi:arm64
      - task: virtionet:efi:riscv64
      - task: virtionet:efi:loong64

  # Phase-2 M3-minimal probe builds — same pipeline as M2 but with the
  # `phase2_ministack_ping` tag (NOT `phase2_virtionet_tx` — the two
  # probes both bring up the virtio-net device and would step on each
  # other). The probe wires the M2 virtio-net device into our
  # hand-rolled `uefiboard/ministack` (ARP + IPv4 + ICMP4), assigns
  # 10.0.2.15/24 + default-gateway 10.0.2.2 (QEMU NAT defaults), and
  # sends one ICMP Echo Request to the gateway. Outputs go to
  # BOOT<ARCH>-MINISTACK.EFI.
  #
  # Replaces the M3 gvisor probe (R-M3'a CLOSED 2026-06-08 — gvisor
  # was compile-clean but #GP'd inside EDK2 CpuDxe before our
  # dispatcher ran). See `cloud-boot/docs/tamago-uefi-phase2-oci-loader.md`
  # §5 R-M3'a CLOSED for the gvisor backstory + ministack scope.
  ministack:elf:amd64:
    desc: 'Build app_amd64_ministack.elf (TamaGo PIE, M3-minimal + M1.5/M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_ministack_ping -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_ministack.elf .'

  ministack:elf:arm64:
    desc: 'Build app_arm64_ministack.elf (TamaGo PIE, M3-minimal + M1.5/M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_ministack_ping -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_ministack.elf .'

  ministack:elf:riscv64:
    desc: 'Build app_riscv64_ministack.elf (TamaGo PIE, M3-minimal + M1.5/M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_ministack_ping -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_ministack.elf .'

  ministack:elf:loong64:
    desc: 'Build app_loong64_ministack.elf (TamaGo PIE, M3-minimal + M1.5/M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_ministack_ping -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_ministack.elf .'

  ministack:efi:amd64:
    desc: 'Build Phase-2 M3-minimal BOOTX64-MINISTACK.EFI (hand-rolled ARP+IPv4+ICMP4 ping probe).'
    deps: [ministack:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-MINISTACK.EFI" "{{.TASKFILE_DIR}}/app_amd64_ministack.elf"'

  ministack:efi:arm64:
    desc: 'Build Phase-2 M3-minimal BOOTAA64-MINISTACK.EFI (hand-rolled ARP+IPv4+ICMP4 ping probe).'
    deps: [ministack:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-MINISTACK.EFI" "{{.TASKFILE_DIR}}/app_arm64_ministack.elf"'

  ministack:efi:riscv64:
    desc: 'Build Phase-2 M3-minimal BOOTRISCV64-MINISTACK.EFI (hand-rolled ARP+IPv4+ICMP4 ping probe).'
    deps: [ministack:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-MINISTACK.EFI" "{{.TASKFILE_DIR}}/app_riscv64_ministack.elf"'

  ministack:efi:loong64:
    desc: 'Build Phase-2 M3-minimal BOOTLOONGARCH64-MINISTACK.EFI (hand-rolled ARP+IPv4+ICMP4 ping probe).'
    deps: [ministack:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-MINISTACK.EFI" "{{.TASKFILE_DIR}}/app_loong64_ministack.elf"'

  ministack:all:
    desc: 'Build all four Phase-2 M3-minimal ministack ICMP-ping probe EFIs.'
    cmds:
      - task: ministack:efi:amd64
      - task: ministack:efi:arm64
      - task: ministack:efi:riscv64
      - task: ministack:efi:loong64

  ministack:test:
    desc: 'Run host-side ministack unit tests (ARP + IPv4 + ICMP4 + stack dispatch).'
    env:
      GOWORK: 'off'
    cmds:
      - go test -count=1 -cover -v ./uefiboard/ministack/...

  live:ministack:amd64:
    desc: 'Live ICMP ping against QEMU NAT 10.0.2.2 from BOOTX64-MINISTACK.EFI under QEMU+EDK2.'
    deps: [ministack:efi:amd64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/liveministack/run.sh" amd64'

  live:ministack:arm64:
    desc: 'Live ICMP ping against QEMU NAT 10.0.2.2 from BOOTAA64-MINISTACK.EFI under QEMU+EDK2.'
    deps: [ministack:efi:arm64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/liveministack/run.sh" arm64'

  live:ministack:riscv64:
    desc: 'Live ICMP ping against QEMU NAT 10.0.2.2 from BOOTRISCV64-MINISTACK.EFI under QEMU+EDK2.'
    deps: [ministack:efi:riscv64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/liveministack/run.sh" riscv64'

  live:ministack:loong64:
    desc: 'Live ICMP ping against QEMU NAT 10.0.2.2 from BOOTLOONGARCH64-MINISTACK.EFI under QEMU+EDK2.'
    deps: [ministack:efi:loong64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/liveministack/run.sh" loong64'

  # Phase-2 M4 probe builds — DHCPv4 acquire over ministack. Same
  # pipeline as ministack: but with the `phase2_dhcp4_acquire` tag
  # instead of `phase2_ministack_ping` (the two share the virtio-net
  # device and must not run together). The probe sends DISCOVER →
  # OFFER → REQUEST → ACK against QEMU's built-in SLIRP DHCP server,
  # prints the resulting lease, applies it to the Stack, and pings
  # the learned gateway to verify end-to-end reachability.
  # Outputs go to BOOT<ARCH>-DHCP4.EFI.
  dhcp4:elf:amd64:
    desc: 'Build app_amd64_dhcp4.elf (TamaGo PIE, M4 DHCPv4 probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_dhcp4_acquire -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_dhcp4.elf .'

  dhcp4:elf:arm64:
    desc: 'Build app_arm64_dhcp4.elf (TamaGo PIE, M4 DHCPv4 probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_dhcp4_acquire -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_dhcp4.elf .'

  dhcp4:elf:riscv64:
    desc: 'Build app_riscv64_dhcp4.elf (TamaGo PIE, M4 DHCPv4 probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_dhcp4_acquire -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_dhcp4.elf .'

  dhcp4:elf:loong64:
    desc: 'Build app_loong64_dhcp4.elf (TamaGo PIE, M4 DHCPv4 probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase2_dhcp4_acquire -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_dhcp4.elf .'

  dhcp4:efi:amd64:
    desc: 'Build Phase-2 M4 BOOTX64-DHCP4.EFI (pure-Go DHCPv4 acquire probe).'
    deps: [dhcp4:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-DHCP4.EFI" "{{.TASKFILE_DIR}}/app_amd64_dhcp4.elf"'

  dhcp4:efi:arm64:
    desc: 'Build Phase-2 M4 BOOTAA64-DHCP4.EFI (pure-Go DHCPv4 acquire probe).'
    deps: [dhcp4:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-DHCP4.EFI" "{{.TASKFILE_DIR}}/app_arm64_dhcp4.elf"'

  dhcp4:efi:riscv64:
    desc: 'Build Phase-2 M4 BOOTRISCV64-DHCP4.EFI (pure-Go DHCPv4 acquire probe).'
    deps: [dhcp4:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-DHCP4.EFI" "{{.TASKFILE_DIR}}/app_riscv64_dhcp4.elf"'

  dhcp4:efi:loong64:
    desc: 'Build Phase-2 M4 BOOTLOONGARCH64-DHCP4.EFI (pure-Go DHCPv4 acquire probe).'
    deps: [dhcp4:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-DHCP4.EFI" "{{.TASKFILE_DIR}}/app_loong64_dhcp4.elf"'

  dhcp4:all:
    desc: 'Build all four Phase-2 M4 DHCPv4 acquire probe EFIs.'
    cmds:
      - task: dhcp4:efi:amd64
      - task: dhcp4:efi:arm64
      - task: dhcp4:efi:riscv64
      - task: dhcp4:efi:loong64

  dhcp4:test:
    desc: 'Run host-side ministack unit tests including UDP4 + DHCP4 (M4 coverage gate >=80%).'
    env:
      GOWORK: 'off'
    cmds:
      - go test -count=1 -cover -v ./uefiboard/ministack/...

  live:dhcp4:amd64:
    desc: 'Live DHCPv4 acquire against QEMU NAT from BOOTX64-DHCP4.EFI under QEMU+EDK2.'
    deps: [dhcp4:efi:amd64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/livedhcp4/run.sh" amd64'

  live:dhcp4:arm64:
    desc: 'Live DHCPv4 acquire against QEMU NAT from BOOTAA64-DHCP4.EFI under QEMU+EDK2.'
    deps: [dhcp4:efi:arm64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/livedhcp4/run.sh" arm64'

  live:dhcp4:riscv64:
    desc: 'Live DHCPv4 acquire against QEMU NAT from BOOTRISCV64-DHCP4.EFI under QEMU+EDK2.'
    deps: [dhcp4:efi:riscv64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/livedhcp4/run.sh" riscv64'

  live:dhcp4:loong64:
    desc: 'Live DHCPv4 acquire against QEMU NAT from BOOTLOONGARCH64-DHCP4.EFI under QEMU+EDK2.'
    deps: [dhcp4:efi:loong64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/livedhcp4/run.sh" loong64'

  # uefiboard:test — host-side unit tests for the M0 parser/types
  # (memorymap.go, http_protocol.go). Does NOT exercise the live
  # GetMemoryMap call (that lives in the --tag phase2_probe binary;
  # boot it under QEMU/OVMF for the live smoke test).
  uefiboard:test:
    desc: 'Run host-side uefiboard unit tests (parser + GUID layouts).'
    env:
      GOWORK: 'off'
    cmds:
      - go test -count=1 -v ./uefiboard/...

  clean:
    desc: Remove built ELFs and EFIs.
    cmds:
      - rm -f app.elf app_amd64.elf app_arm64.elf app_riscv64.elf app_loong64.elf
      - rm -f app_amd64_probe.elf app_arm64_probe.elf app_riscv64_probe.elf app_loong64_probe.elf
      - rm -f app_amd64_pcienum.elf app_arm64_pcienum.elf app_riscv64_pcienum.elf app_loong64_pcienum.elf
      - rm -f app_amd64_pcisnp.elf app_arm64_pcisnp.elf app_riscv64_pcisnp.elf app_loong64_pcisnp.elf
      - rm -f app_amd64_blkprintk.elf app_arm64_blkprintk.elf app_riscv64_blkprintk.elf app_loong64_blkprintk.elf
      - rm -f app_amd64_virtionet.elf app_arm64_virtionet.elf app_riscv64_virtionet.elf app_loong64_virtionet.elf
      - rm -f app_amd64_ministack.elf app_arm64_ministack.elf app_riscv64_ministack.elf app_loong64_ministack.elf
      - rm -f app_amd64_dhcp4.elf app_arm64_dhcp4.elf app_riscv64_dhcp4.elf app_loong64_dhcp4.elf
      - rm -f BOOTX64.EFI BOOTAA64.EFI BOOTRISCV64.EFI BOOTLOONGARCH64.EFI
      - rm -f BOOTX64-PROBE.EFI BOOTAA64-PROBE.EFI BOOTRISCV64-PROBE.EFI BOOTLOONGARCH64-PROBE.EFI
      - rm -f BOOTX64-PCIENUM.EFI BOOTAA64-PCIENUM.EFI BOOTRISCV64-PCIENUM.EFI BOOTLOONGARCH64-PCIENUM.EFI
      - rm -f BOOTX64-PCISNP.EFI BOOTAA64-PCISNP.EFI BOOTRISCV64-PCISNP.EFI BOOTLOONGARCH64-PCISNP.EFI
      - rm -f BOOTX64-BLKPRINT.EFI BOOTAA64-BLKPRINT.EFI BOOTRISCV64-BLKPRINT.EFI BOOTLOONGARCH64-BLKPRINT.EFI
      - rm -f BOOTX64-VIRTIONET.EFI BOOTAA64-VIRTIONET.EFI BOOTRISCV64-VIRTIONET.EFI BOOTLOONGARCH64-VIRTIONET.EFI
      - rm -f BOOTX64-MINISTACK.EFI BOOTAA64-MINISTACK.EFI BOOTRISCV64-MINISTACK.EFI BOOTLOONGARCH64-MINISTACK.EFI
      - rm -f BOOTX64-DHCP4.EFI BOOTAA64-DHCP4.EFI BOOTRISCV64-DHCP4.EFI BOOTLOONGARCH64-DHCP4.EFI
