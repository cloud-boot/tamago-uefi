  # =====================================================================
  # Phase-2 M6.2 de-risk experiment — chained LoadImage threshold sweep
  # =====================================================================
  #
  # amd64-only. Builds four tiny chained variants (A/B/C are TamaGo PIE
  # at the runtime floor ~1.7 MiB; Z is a hand-rolled 1 KiB PE32+),
  # stages each gzipped into internal/embed_chained_tiny, then links a
  # parent (BOOTX64-EFITINY.EFI) with the phase2_efi_tiny_handover tag.
  # The parent iterates through every variant calling
  # gBS->LoadImage+StartImage and prints PASS/FAIL per variant. The
  # live runner inspects the QEMU+EDK2 log for the per-variant signals
  # plus the CpuDxe.dll +0x110C #GP block.
  #
  # See cloud-boot/docs/tamago-uefi-phase2-oci-loader.md §5 M6.1 / M6.2
  # for the threshold table this produces.
  chainedtinyA:elf:amd64:
    desc: 'Build app_amd64_chainedtinyA.elf (TamaGo PIE, M6.2 tinyA payload).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_chainedtinyA.elf ./cmd/chainedtinyA'

  chainedtinyB:elf:amd64:
