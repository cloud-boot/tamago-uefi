  # =====================================================================
  # Phase 3 sprint 1 — first OS-agnostic OCI boot: FreeBSD MVP (amd64)
  # =====================================================================
  #
  # Streams a FreeBSD bootable disk image (GPT + FAT ESP + loader.efi)
  # from an OCI artifact, installs a synthetic EFI_BLOCK_IO_PROTOCOL
  # backed by the streamed bytes, drives ConnectController so the EDK2
  # PartitionDxe + FatDxe stack discovers the ESP, and LoadImage's the
  # loader.efi. Sprint 1 PASS gate is "ConnectController + SFS surfaced
  # + MVP CHAIN COMPLETE". Sprint 2 adds UFS support so loader.efi can
  # find its kernel.
  #
  # See cloud-boot/docs/phase3-multi-os-oci-boot.md for the design +
  # roadmap to NetBSD/OpenBSD/Windows.
  freebsdboot:elf:amd64:
    desc: 'Build app_amd64_freebsdboot.elf (TamaGo PIE, Phase 3 sprint 1 probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk,phase3_oci_freebsd_boot -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_freebsdboot.elf .'

  freebsdboot:efi:amd64:
    desc: 'Build Phase-3 sprint-1 BOOTX64-FREEBSDBOOT.EFI (OCI streaming + BlockIO publish + ConnectController + LoadImage(loader.efi)).'
    deps: [freebsdboot:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-FREEBSDBOOT.EFI" "{{.TASKFILE_DIR}}/app_amd64_freebsdboot.elf"'

  freebsdboot:live:amd64:
    desc: 'Phase-3 sprint-1 FreeBSD MVP live smoke under QEMU+EDK2. Requires a local FreeBSD ISO (CLOUDBOOT_FREEBSD_IMAGE or default paths).'
    deps: [freebsdboot:efi:amd64]
    cmds:
      - 'bash "{{.TASKFILE_DIR}}/internal/livefreebsdboot/run.sh" amd64'

  # ---------------------------------------------------------------------
  # Phase 3 sprint 3 — NetBSD + OpenBSD MVPs
  # ---------------------------------------------------------------------
  # Same Block IO + SFS + ConnectController + LoadImage chain as the
  # FreeBSD MVP, just with the OS-specific OCI ref and EFI bootloader.
  # NetBSD/OpenBSD modern releases use FFSv2/UFS2 which is on-disk
  # compatible with go-filesystems/ufs — no driver gap to close in
  # sprint 3. UFS-root + multi-user are sprint 3.x follow-ups.
  netbsdboot:elf:amd64:
    desc: 'Build app_amd64_netbsdboot.elf (TamaGo PIE, Phase 3 sprint 3 NetBSD probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
