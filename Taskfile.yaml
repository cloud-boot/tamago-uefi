version: '3'

# Reproducible per-arch build pipeline for cloud-boot/tamago-uefi.
#
# Why a Taskfile (not a shell snippet in the README): the build pipeline
# needs GOOS=tamago, GOOSPKG, the correct GOARCH, the right -tags and
# -ldflags, AND the right toolchain ($TAMAGO/bin/go, not the host `go`).
# Open-coding that in a shell each time is how `BOOTRISCV64.EFI` ended up
# with `runtime.GOARCH=amd64` baked into rodata while the .text was
# RISC-V machine code — the env wasn't reset between targets. Each task
# below pins every env var explicitly so no stale value from a previous
# `export` can leak in.
#
# Toolchain locations (overridable):
#   TAMAGO   : path to tamago-go (defaults to ../../../localhost/tamago-pie)
#   PECTL    : path to the pectl source dir (defaults to ../../go-coff/pectl)
#
# The default `pectl` invocation builds it on the fly via `go run` so the
# binary needn't be installed.

vars:
  TAMAGO:
    sh: |
      if [ -n "$TAMAGO" ]; then echo "$TAMAGO";
      else echo "{{.TASKFILE_DIR}}/../../../localhost/tamago-pie"; fi
  PECTL_DIR:
    sh: |
      if [ -n "$PECTL_DIR" ]; then echo "$PECTL_DIR";
      else echo "{{.TASKFILE_DIR}}/../../go-coff/pectl"; fi
  GOOSPKG: github.com/usbarmory/tamago
  BUILD_TAGS: linkcpuinit,linkramstart
  LDFLAGS: -E cpuinit

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list-all
    silent: true

  check-toolchain:
    desc: Verify the tamago-go toolchain and pectl source are reachable.
    silent: true
    cmds:
      - 'test -x "{{.TAMAGO}}/bin/go" || (echo "tamago-go not found at {{.TAMAGO}}/bin/go (set TAMAGO=...)"; exit 1)'
      - 'test -f "{{.PECTL_DIR}}/main.go" || (echo "pectl source not found at {{.PECTL_DIR}} (set PECTL_DIR=...)"; exit 1)'
      - 'echo "toolchain ok: {{.TAMAGO}}/bin/go + {{.PECTL_DIR}}"'

  elf:amd64:
    desc: Build app_amd64.elf (TamaGo PIE, GOOS=tamago GOARCH=amd64).
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64.elf .'

  elf:arm64:
    desc: Build app_arm64.elf (TamaGo PIE, GOOS=tamago GOARCH=arm64).
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64.elf .'

  elf:riscv64:
    desc: Build app_riscv64.elf (TamaGo PIE, GOOS=tamago GOARCH=riscv64).
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64.elf .'

  elf:loong64:
    desc: Build app_loong64.elf (TamaGo PIE, GOOS=tamago GOARCH=loong64).
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}} -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64.elf .'

  efi:amd64:
    desc: Link BOOTX64.EFI from app_amd64.elf via pectl link-pie.
    deps: [elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64.EFI" "{{.TASKFILE_DIR}}/app_amd64.elf"'

  efi:arm64:
    desc: Link BOOTAA64.EFI from app_arm64.elf via pectl link-pie.
    deps: [elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64.EFI" "{{.TASKFILE_DIR}}/app_arm64.elf"'

  efi:riscv64:
    desc: Link BOOTRISCV64.EFI from app_riscv64.elf via pectl link-pie.
    deps: [elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64.EFI" "{{.TASKFILE_DIR}}/app_riscv64.elf"'

  efi:loong64:
    desc: Link BOOTLOONGARCH64.EFI from app_loong64.elf via pectl link-pie.
    deps: [elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64.EFI" "{{.TASKFILE_DIR}}/app_loong64.elf"'

  all:
    desc: Build all four EFIs (amd64, arm64, riscv64, loong64).
    cmds:
      - task: efi:amd64
      - task: efi:arm64
      - task: efi:riscv64
      - task: efi:loong64

  test:
    desc: Run banner-rodata tests against the produced EFIs.
    deps: [all]
    env:
      GOWORK: 'off'
    cmds:
      - go test -count=1 -v ./internal/bannertest/...

  # Phase-2 M0 probe builds — same pipeline as the Phase-1 targets but
  # with the `phase2_probe` build tag, which compiles in
  # phase2_probe.go's GetMemoryMap call. The default (untagged) build
  # excludes phase2_probe.go and keeps Phase 1 banner-only behaviour.
  # Outputs go to BOOT<ARCH>-PROBE.EFI to keep them separate from the
  # default artifacts.
  probe:elf:amd64:
    desc: 'Build app_amd64_probe.elf (TamaGo PIE with -tags phase2_probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_probe -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_probe.elf .'

  probe:elf:arm64:
    desc: 'Build app_arm64_probe.elf (TamaGo PIE with -tags phase2_probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_probe -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_probe.elf .'

  probe:elf:riscv64:
    desc: 'Build app_riscv64_probe.elf (TamaGo PIE with -tags phase2_probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_probe -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_probe.elf .'

  probe:elf:loong64:
    desc: 'Build app_loong64_probe.elf (TamaGo PIE with -tags phase2_probe).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_probe -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_probe.elf .'

  probe:memory:amd64:
    desc: 'Build Phase-2 M0 probe BOOTX64-PROBE.EFI (GetMemoryMap smoke test).'
    deps: [probe:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-PROBE.EFI" "{{.TASKFILE_DIR}}/app_amd64_probe.elf"'

  probe:memory:arm64:
    desc: 'Build Phase-2 M0 probe BOOTAA64-PROBE.EFI (GetMemoryMap smoke test).'
    deps: [probe:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-PROBE.EFI" "{{.TASKFILE_DIR}}/app_arm64_probe.elf"'

  probe:memory:riscv64:
    desc: 'Build Phase-2 M0 probe BOOTRISCV64-PROBE.EFI (GetMemoryMap smoke test).'
    deps: [probe:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-PROBE.EFI" "{{.TASKFILE_DIR}}/app_riscv64_probe.elf"'

  probe:memory:loong64:
    desc: 'Build Phase-2 M0 probe BOOTLOONGARCH64-PROBE.EFI (GetMemoryMap smoke test).'
    deps: [probe:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-PROBE.EFI" "{{.TASKFILE_DIR}}/app_loong64_probe.elf"'

  probe:memory:all:
    desc: 'Build all four Phase-2 M0 probe EFIs.'
    cmds:
      - task: probe:memory:amd64
      - task: probe:memory:arm64
      - task: probe:memory:riscv64
      - task: probe:memory:loong64

  # Phase-2 M1 probe builds — same pipeline as M0, but with the
  # `phase2_pcienum` build tag, which compiles in phase2_pcienum.go's
  # EFI_PCI_IO_PROTOCOL walk + virtio-net identity probe. The two
  # probe tags (phase2_probe and phase2_pcienum) are mutually exclusive
  # at build time; phase2_probe_stub.go gates on `!both` so the default
  # (untagged) build still excludes both probes and keeps Phase 1
  # banner-only behaviour. Outputs go to BOOT<ARCH>-PCIENUM.EFI to keep
  # them separate from M0 and Phase-1 artifacts.
  pcienum:elf:amd64:
    desc: 'Build app_amd64_pcienum.elf (TamaGo PIE with -tags phase2_pcienum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_pcienum.elf .'

  pcienum:elf:arm64:
    desc: 'Build app_arm64_pcienum.elf (TamaGo PIE with -tags phase2_pcienum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_pcienum.elf .'

  pcienum:elf:riscv64:
    desc: 'Build app_riscv64_pcienum.elf (TamaGo PIE with -tags phase2_pcienum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_pcienum.elf .'

  pcienum:elf:loong64:
    desc: 'Build app_loong64_pcienum.elf (TamaGo PIE with -tags phase2_pcienum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_pcienum.elf .'

  pcienum:efi:amd64:
    desc: 'Build Phase-2 M1 BOOTX64-PCIENUM.EFI (PCI IO + virtio-net identity probe).'
    deps: [pcienum:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-PCIENUM.EFI" "{{.TASKFILE_DIR}}/app_amd64_pcienum.elf"'

  pcienum:efi:arm64:
    desc: 'Build Phase-2 M1 BOOTAA64-PCIENUM.EFI (PCI IO + virtio-net identity probe).'
    deps: [pcienum:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-PCIENUM.EFI" "{{.TASKFILE_DIR}}/app_arm64_pcienum.elf"'

  pcienum:efi:riscv64:
    desc: 'Build Phase-2 M1 BOOTRISCV64-PCIENUM.EFI (PCI IO + virtio-net identity probe).'
    deps: [pcienum:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-PCIENUM.EFI" "{{.TASKFILE_DIR}}/app_riscv64_pcienum.elf"'

  pcienum:efi:loong64:
    desc: 'Build Phase-2 M1 BOOTLOONGARCH64-PCIENUM.EFI (PCI IO + virtio-net identity probe).'
    deps: [pcienum:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-PCIENUM.EFI" "{{.TASKFILE_DIR}}/app_loong64_pcienum.elf"'

  pcienum:all:
    desc: 'Build all four Phase-2 M1 PCI-IO enumeration probe EFIs.'
    cmds:
      - task: pcienum:efi:amd64
      - task: pcienum:efi:arm64
      - task: pcienum:efi:riscv64
      - task: pcienum:efi:loong64

  # Phase-2 M1.5 combined probe (PCI-IO + SNP) builds — same pipeline
  # as the M1 pcienum targets but with BOTH phase2_pcienum AND
  # phase2_snpenum tags set, so the dispatcher (phase2_dispatch.go)
  # runs the PCI walk first then the SNP walk in one binary. Outputs
  # go to BOOT<ARCH>-PCISNP.EFI to keep them separate from the
  # pcienum-only artifacts.
  pcisnp:elf:amd64:
    desc: 'Build app_amd64_pcisnp.elf (TamaGo PIE with -tags phase2_pcienum,phase2_snpenum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_pcisnp.elf .'

  pcisnp:elf:arm64:
    desc: 'Build app_arm64_pcisnp.elf (TamaGo PIE with -tags phase2_pcienum,phase2_snpenum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_pcisnp.elf .'

  pcisnp:elf:riscv64:
    desc: 'Build app_riscv64_pcisnp.elf (TamaGo PIE with -tags phase2_pcienum,phase2_snpenum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_pcisnp.elf .'

  pcisnp:elf:loong64:
    desc: 'Build app_loong64_pcisnp.elf (TamaGo PIE with -tags phase2_pcienum,phase2_snpenum).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_pcisnp.elf .'

  pcisnp:efi:amd64:
    desc: 'Build Phase-2 M1.5 BOOTX64-PCISNP.EFI (PCI IO + SNP enumeration probe).'
    deps: [pcisnp:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-PCISNP.EFI" "{{.TASKFILE_DIR}}/app_amd64_pcisnp.elf"'

  pcisnp:efi:arm64:
    desc: 'Build Phase-2 M1.5 BOOTAA64-PCISNP.EFI (PCI IO + SNP enumeration probe).'
    deps: [pcisnp:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-PCISNP.EFI" "{{.TASKFILE_DIR}}/app_arm64_pcisnp.elf"'

  pcisnp:efi:riscv64:
    desc: 'Build Phase-2 M1.5 BOOTRISCV64-PCISNP.EFI (PCI IO + SNP enumeration probe).'
    deps: [pcisnp:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-PCISNP.EFI" "{{.TASKFILE_DIR}}/app_riscv64_pcisnp.elf"'

  pcisnp:efi:loong64:
    desc: 'Build Phase-2 M1.5 BOOTLOONGARCH64-PCISNP.EFI (PCI IO + SNP enumeration probe).'
    deps: [pcisnp:elf:loong64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTLOONGARCH64-PCISNP.EFI" "{{.TASKFILE_DIR}}/app_loong64_pcisnp.elf"'

  pcisnp:all:
    desc: 'Build all four Phase-2 M1.5 PCI-IO + SNP probe EFIs.'
    cmds:
      - task: pcisnp:efi:amd64
      - task: pcisnp:efi:arm64
      - task: pcisnp:efi:riscv64
      - task: pcisnp:efi:loong64

  # Phase-2 M1.6 Block-IO side-channel observability probe — same
  # pipeline as M1.5 (pcienum + snpenum together) PLUS the
  # `phase2_blkprintk` build tag, which compiles in the Block-IO
  # ring-buffer print-tee + the LBA-0 scratch writer. On QEMU+EDK2 this
  # mirrors ConOut to a scratch virtio-blk; on Apple VZ (vfkit 0.6.3)
  # where ConOut captures 0 bytes through `virtio-serial,logFilePath`
  # (see R-M1'a in cloud-boot/docs), it's the ONLY way to observe the
  # probe's output. Outputs go to BOOT<ARCH>-BLKPRINT.EFI.
  blkprintk:elf:amd64:
    desc: 'Build app_amd64_blkprintk.elf (TamaGo PIE, M1.5+M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_amd64_blkprintk.elf .'

  blkprintk:elf:arm64:
    desc: 'Build app_arm64_blkprintk.elf (TamaGo PIE, M1.5+M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: arm64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_arm64_blkprintk.elf .'

  blkprintk:elf:riscv64:
    desc: 'Build app_riscv64_blkprintk.elf (TamaGo PIE, M1.5+M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: riscv64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_riscv64_blkprintk.elf .'

  blkprintk:elf:loong64:
    desc: 'Build app_loong64_blkprintk.elf (TamaGo PIE, M1.5+M1.6 tags).'
    deps: [check-toolchain]
    env:
      GOOS: tamago
      GOOSPKG: '{{.GOOSPKG}}'
      GOARCH: loong64
      CGO_ENABLED: '0'
      GOWORK: 'off'
    cmds:
      - '{{.TAMAGO}}/bin/go build -tags {{.BUILD_TAGS}},phase2_pcienum,phase2_snpenum,phase2_blkprintk -trimpath -buildmode=pie -ldflags "{{.LDFLAGS}}" -o app_loong64_blkprintk.elf .'

  blkprintk:efi:amd64:
    desc: 'Build Phase-2 M1.6 BOOTX64-BLKPRINT.EFI (PCI IO + SNP + Block-IO side-channel).'
    deps: [blkprintk:elf:amd64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTX64-BLKPRINT.EFI" "{{.TASKFILE_DIR}}/app_amd64_blkprintk.elf"'

  blkprintk:efi:arm64:
    desc: 'Build Phase-2 M1.6 BOOTAA64-BLKPRINT.EFI (PCI IO + SNP + Block-IO side-channel).'
    deps: [blkprintk:elf:arm64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTAA64-BLKPRINT.EFI" "{{.TASKFILE_DIR}}/app_arm64_blkprintk.elf"'

  blkprintk:efi:riscv64:
    desc: 'Build Phase-2 M1.6 BOOTRISCV64-BLKPRINT.EFI (PCI IO + SNP + Block-IO side-channel).'
    deps: [blkprintk:elf:riscv64]
    cmds:
      - 'cd "{{.PECTL_DIR}}" && go run . link-pie -o "{{.TASKFILE_DIR}}/BOOTRISCV64-BLKPRINT.EFI" "{{.TASKFILE_DIR}}/app_riscv64_blkprintk.elf"'

  blkprintk:efi:loong64:
    desc: 'Build Phase-2 M1.6 BOOTLOONGARCH64-BLKPRINT.EFI (PCI IO + SNP + Block-IO side-channel).'
    deps: [blkprintk:elf:loong64]
    cmds:
