# bsdinstall scripted configuration for a minimal FreeBSD 14.3 install
# onto a single virtio-blk target disk.
#
# This file is NOT consumed by install.sh in the fast path we shipped:
# release engineering produces an equivalent rootfs upstream, and we
# download/extract that directly. The file is checked in so that, if
# the upstream raw.xz ever disappears or becomes unsuitable, the
# install-in-QEMU fallback path can be reactivated by feeding this
# file to `bsdinstall script` from inside a booted bootonly ISO:
#
#   # bsdinstall script /mnt/bsdinstall.cfg
#
# References: bsdinstall(8) "SCRIPTING" section.

# Pre-set the non-interactive variables expected by bsdinstall(8).
DISTRIBUTIONS="kernel.txz base.txz"
PARTITIONS=DEFAULT
BSDINSTALL_DISTSITE="https://download.freebsd.org/releases/amd64/14.3-RELEASE"
nonInteractive="YES"

# Embedded shell script — runs after the base+kernel extract, inside the
# new root, to set a default password and enable DHCP on the primary
# NIC. Both are convenient defaults for the fixture; cloud-boot's
# integration tests do not rely on them.
#!/bin/sh
echo 'cloudboot' | pw usermod root -h 0
sysrc ifconfig_DEFAULT="DHCP"
sysrc sshd_enable="YES"
sysrc hostname="cloudboot-fixture"
echo "fixture build complete; powering down"
poweroff
