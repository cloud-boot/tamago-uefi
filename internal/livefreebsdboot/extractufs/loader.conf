# Synthetic /boot/loader.conf for the cloud-boot UFS2 fixture.
# The stock FreeBSD 14.3 VM image does not ship a /boot/loader.conf
# (it is an end-user customisation file), so we author one here and
# minimize_fixture.sh copies it into bootroot/boot/ before genufs
# packs the tiny UFS image.

# Verbose boot so cloud-boot's TPM-bound serial log captures the
# loader → kernel handoff in full.
boot_verbose="YES"

# Console on the first UART; matches the QEMU -nographic default.
console="comconsole"
comconsole_speed="115200"

# Skip the loader menu; we want a fully non-interactive boot path
# for the live test.
autoboot_delay="-1"
beastie_disable="YES"
