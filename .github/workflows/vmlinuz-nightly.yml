#
# Nightly republish of the riscv64 + loong64 + arm64 + amd64 EFI-stub
# vmlinuz OCI artifacts referenced by kernelboot_<arch>.go for all
# four arches. M8.13 (2026-06-10) added arm64 + amd64 to the fan-out;
# until then arm64 used the (stale) ghcr.io/siderolabs/kernel ref and
# amd64 was DORMANT.
#
# Why: ttl.sh tags expire 24h after the last push. Without this cron
# the live M8.4 MODE C demo breaks daily. This workflow re-extracts
# from the upstream Debian .deb and re-pushes to the same ttl.sh tag,
# resetting the TTL clock to T+24h each morning.
#
# Two push legs per arch:
#
#   1. PRIMARY (always runs): anonymous push to ttl.sh/cloudboot-
#      vmlinuz-<arch>:24h. Same path that powers the live demo today.
#      No secret required.
#
#   2. SECONDARY (gated on GHCR_TOKEN repo secret): bearer-auth push
#      to ghcr.io/cloud-boot/vmlinuz-<arch>:latest. Permanent — no
#      TTL — once provisioned. To enable, run ONCE on the repo
#      maintainer's machine:
#
#        gh auth refresh -h github.com -s write:packages
#        TOKEN=$(gh auth token)
#        gh secret set GHCR_TOKEN --body "$TOKEN" \
#          --repo cloud-boot/tamago-uefi
#
#      Or, if using a fine-grained PAT:
#
#        # at https://github.com/settings/tokens, create a classic PAT
#        # with scope: write:packages (and read:packages)
#        gh secret set GHCR_TOKEN --body <paste-PAT> \
#          --repo cloud-boot/tamago-uefi
#
#      The secondary leg is skipped (one-line notice in the log) when
#      GHCR_TOKEN is absent. The workflow still passes as long as the
#      primary ttl.sh leg succeeds.

name: vmlinuz-nightly

on:
  schedule:
    # 04:00 UTC daily — ~20h after a typical previous-day push, well
    # within the ttl.sh 24h window so the demo never gaps.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  # packages: write is NOT requested via GITHUB_TOKEN because ghcr.io
  # uses a separate PAT (GHCR_TOKEN secret) so the publish identity
  # is the cloud-boot maintainer rather than the workflow runner.

jobs:
  republish:
    name: republish vmlinuz (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: no hard-pinned `src:` .deb URL any more. The Debian
        # archive drops superseded point-release kernels from the pool
        # within weeks (deb.debian.org/.../pool/... starts returning
        # HTTP 404), which is exactly what took this job RED. Instead
        # the "Resolve latest kernel .deb" step below resolves the
        # newest kernel .deb for each arch AT RUN TIME from the
        # canonical Debian `Packages` index, so there is no version to
        # rot. See that step for the selection rules.
        include:
          - arch: riscv64
            ttl_dst: 'ttl.sh/cloudboot-vmlinuz-riscv64:24h'
            ghcr_dst: 'ghcr.io/cloud-boot/vmlinuz-riscv64:latest'
            cmdline_hint: 'console=hvc0 earlycon=sbi'
          - arch: loong64
            ttl_dst: 'ttl.sh/cloudboot-vmlinuz-loong64:24h'
            ghcr_dst: 'ghcr.io/cloud-boot/vmlinuz-loong64:latest'
            cmdline_hint: 'console=ttyS0,115200'
          - arch: arm64
            ttl_dst: 'ttl.sh/cloudboot-vmlinuz-arm64:24h'
            ghcr_dst: 'ghcr.io/cloud-boot/vmlinuz-arm64:latest'
            cmdline_hint: 'console=ttyAMA0,115200 earlycon=pl011,mmio32,0x9000000'
          - arch: amd64
            ttl_dst: 'ttl.sh/cloudboot-vmlinuz-amd64:24h'
            ghcr_dst: 'ghcr.io/cloud-boot/vmlinuz-amd64:latest'
            cmdline_hint: 'console=ttyS0,115200 earlyprintk=ttyS0,115200'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build cloudboot-oci-extract
        run: |
          GOWORK=off go build -o /tmp/cloudboot-oci-extract \
            ./cmd/cloudboot-oci-extract/
          /tmp/cloudboot-oci-extract -h || true

      - name: Resolve latest kernel .deb (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Durable, self-healing replacement for the old hard-pinned
          # `.deb` URLs. We resolve the real kernel .deb for this arch at
          # run time from Debian's canonical binary `Packages` index, so
          # we never name a version that the archive can later drop
          # (which is what produced the daily HTTP-404 failures).
          #
          # Suite = `sid` (unstable): the rolling suite always carries the
          # newest kernel for every Debian release architecture and is
          # never frozen or removed, so its index never 404s.
          #
          # IMPORTANT: the plain `linux-image-<ver>-<arch>` package is
          # ONLY a ~15 KB metapackage (Installed-Size: 15) that has no
          # `/boot/vmlinuz` of its own -- it merely `Depends:` on the real
          # kernel binary. Fetching it hands the extractor an empty
          # archive ("no /boot/vmlinuz found"). So we do two hops:
          #
          #   1. Find the newest `linux-image-<ver>-<arch>` metapackage and
          #      read its `Depends:`.
          #   2. Pull the `linux-binary-<ver>-<arch>` name out of those
          #      Depends -- that is the package that actually ships
          #      `/boot/vmlinuz*` (tens of MB) -- and resolve ITS
          #      `Filename:` from the same index.
          #
          # For arm64/amd64 that binary is built from
          # `src:linux-signed-<arch>` and its Filename points at the
          # signed pool (the EFI-stub the loader expects); for
          # riscv64/loong64 there is no signed variant so it is the
          # `src:linux` binary under `pool/main/l/linux/`. We exclude the
          # -dbg / -cloud / -rt / -16k / -unsigned variants and any
          # experimental `~rc`/`~exp` version, and pick the highest
          # version with `dpkg --compare-versions`.
          BASE="https://deb.debian.org/debian"
          IDX="$BASE/dists/sid/main/binary-${ARCH}/Packages.gz"
          echo "resolving kernel image for ${ARCH} from ${IDX}"

          PKGS="$(mktemp)"
          curl -fsSL --retry 5 --retry-delay 3 "$IDX" | gzip -dc > "$PKGS"

          # Hop 1: newest metapackage -> its Depends line.
          mapfile -t metas < <(awk -v arch="$ARCH" '
              /^Package: /  { pkg=$2 }
              /^Version: /  { ver=$2 }
              /^Depends: /  { $1=""; dep=substr($0,2) }
              /^$/ {
                if (pkg ~ ("^linux-image-[0-9].*-" arch "$") &&
                    pkg !~ /-(dbg|cloud|rt|16k|unsigned)(-|$)/ &&
                    ver !~ /~/) {
                  print ver "\t" dep
                }
                pkg=""; ver=""; dep=""
              }' "$PKGS")
          if [ "${#metas[@]}" -eq 0 ]; then
            echo "::error::no linux-image metapackage found for ${ARCH} in sid" >&2
            exit 1
          fi
          bestver=""; bestdep=""
          for line in "${metas[@]}"; do
            v="${line%%$'\t'*}"; d="${line#*$'\t'}"
            if [ -z "$bestver" ] || dpkg --compare-versions "$v" gt "$bestver"; then
              bestver="$v"; bestdep="$d"
            fi
          done

          # Hop 2: the linux-binary-<...>-<arch> dependency = real image.
          binpkg="$(printf '%s\n' "$bestdep" | tr ',' '\n' \
            | grep -oE "linux-binary-[^ ]*-${ARCH}" | head -1)"
          if [ -z "$binpkg" ]; then
            echo "::error::no linux-binary dependency in metapackage ${bestver} (${ARCH})" >&2
            echo "Depends was: ${bestdep}" >&2
            exit 1
          fi
          binfn="$(awk -v p="$binpkg" '
              /^Package: /  { pkg=$2 }
              /^Filename: / { fn=$2 }
              /^$/ { if (pkg==p) { print fn; exit } ; pkg=""; fn="" }' "$PKGS")"
          if [ -z "$binfn" ]; then
            echo "::error::no Filename for ${binpkg} in sid ${ARCH} index" >&2
            exit 1
          fi
          rm -f "$PKGS"

          URL="$BASE/$binfn"
          echo "resolved ${ARCH} metapackage ${bestver} -> image package ${binpkg}"
          echo "resolved URL -> ${URL}"

          # Fail loudly HERE (not deep in the extractor) if the archive is
          # not serving the artifact, and guard against ever selecting a
          # tiny metapackage again: the real kernel image is many MB, so
          # anything under 1 MiB is wrong. HEAD only -- the extractor
          # downloads the body itself in the next step.
          LEN="$(curl -fsSL --retry 5 --retry-delay 3 -I "$URL" \
            | awk 'tolower($1)=="content-length:"{print $2}' | tr -d '\r' | tail -1)"
          echo "resolved artifact size: ${LEN:-unknown} bytes"
          if [ -z "${LEN:-}" ] || [ "$LEN" -lt 1048576 ]; then
            echo "::error::resolved .deb for ${ARCH} is only ${LEN:-0} bytes (<1 MiB) -- looks like a metapackage, not a kernel image" >&2
            exit 1
          fi
          echo "SRC=deb:${URL}" >> "$GITHUB_ENV"

      - name: Republish ${{ matrix.arch }} (ttl.sh primary, ghcr.io if GHCR_TOKEN set)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(
            -src "${SRC}"
            -arch "${{ matrix.arch }}"
            -dst "${{ matrix.ttl_dst }}"
            -cmdline-hint "${{ matrix.cmdline_hint }}"
          )
          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "::notice::ghcr.io push ENABLED (GHCR_TOKEN secret present)"
            ARGS+=( -push-to-ghcr "${{ matrix.ghcr_dst }}" )
          else
            echo "::notice::ghcr.io push skipped: no GHCR_TOKEN secret"
          fi
          /tmp/cloudboot-oci-extract "${ARGS[@]}"

      - name: Smoke-pull manifest from ttl.sh
        run: |
          set -euo pipefail
          # Confirm the freshly-published tag is fetchable via the
          # OCI Distribution v2 endpoint. Splits ref host/repo:tag.
          REF='${{ matrix.ttl_dst }}'
          HOST="${REF%%/*}"                   # ttl.sh
          REST="${REF#*/}"                    # cloudboot-vmlinuz-…:24h
          REPO="${REST%:*}"                   # cloudboot-vmlinuz-…
          TAG="${REST##*:}"                   # 24h
          URL="https://${HOST}/v2/${REPO}/manifests/${TAG}"
          echo "smoke-pull: ${URL}"
          curl -fsSL -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "${URL}" | head -c 4096
          echo
          echo "::notice::ttl.sh manifest smoke-pull PASS for ${REF}"
